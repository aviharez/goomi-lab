<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pixel Skies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3EEE5;--ink:#17131C;--plum:#5B3A86;--lilac:#C9B3E6;--sun:#FFC23D;--mint:#7FD6A8}
html,body{margin:0;height:100%;background:#17131C;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.ui{position:fixed;font-family:Silkscreen,ui-monospace,monospace;color:var(--paper);text-shadow:2px 2px 0 var(--ink);pointer-events:none}
#hud{top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;display:none;justify-content:space-between;align-items:flex-start;gap:12px}
#score{font-size:28px;line-height:1}
#orbs{font-size:13px;margin-top:6px;color:var(--sun)}
.bar{width:110px;height:14px;background:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(23,19,28,.35)}
.bar i{display:block;height:100%;width:100%;background:var(--mint);transition:width .15s}
.lbl{font-size:11px;text-align:right;margin-bottom:4px}
.btn{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));font-family:Silkscreen,monospace;font-size:14px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 12px;display:none;cursor:pointer;touch-action:none}
#view{right:16px;font-size:12px;padding:8px 10px;bottom:calc(84px + env(safe-area-inset-bottom))}
#btnRoll{left:16px;background:var(--mint)}
#btnLoop{right:16px;background:var(--sun)}
#combo{font-size:15px;margin-top:6px;color:var(--mint);min-height:16px}
.altw{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:8px;font-size:11px}
.altbar{width:10px;height:56px;background:var(--ink);border:2px solid var(--ink);display:flex;align-items:flex-end}
.altbar i{display:block;width:100%;background:var(--lilac)}
.pop{left:0;right:0;text-align:center;font-size:22px;animation:popup 1.1s ease-out forwards}
@keyframes popup{0%{transform:translateY(10px) scale(.8);opacity:0}15%{transform:translateY(0) scale(1.1);opacity:1}70%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.screen{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:calc(9vh + env(safe-area-inset-top)) !important;text-align:center;padding:24px;gap:10px}
.chip{display:inline-block;background:var(--plum);color:var(--paper);font-size:13px;padding:6px 10px;text-shadow:none;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
h1{margin:6px 0 0;font-size:clamp(44px,13vw,84px);line-height:.9;font-weight:700;color:var(--paper);text-shadow:4px 4px 0 var(--plum),8px 8px 0 var(--ink)}
.how{font-size:13px;max-width:330px;line-height:1.5}
.tap{margin-top:14px;font-size:20px;color:var(--sun);animation:blink 1s steps(2) infinite}
.credit{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px}
.big{font-size:56px;line-height:1;color:var(--sun)}
@keyframes blink{50%{opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="hud" class="ui">
  <div><div id="score">0</div><div id="orbs">0 SUNS</div><div id="combo"></div></div>
  <div><div class="lbl">FUEL</div><div class="bar"><i id="fuel"></i></div><div class="altw"><span>ALT</span><div class="altbar"><i id="alt"></i></div></div></div>
</div>
<div id="title" class="ui screen">
  <span class="chip">GOOMI LAB #01</span>
  <h1>PIXEL<br>SKIES</h1>
  <div class="how">Drag to steer, climb and dive. Chain suns for combos and fuel. ROLL and LOOP to dodge storms. Every level gets harder.</div>
  <div class="tap">TAP TO FLY</div>
</div>
<div id="over" class="ui screen" style="display:none">
  <span class="chip">OUT OF FUEL</span>
  <div class="big" id="final">0</div>
  <div class="how" id="best">BEST 0</div>
  <div class="tap">TAP TO FLY AGAIN</div>
</div>
<div class="ui credit" id="credit">made by @goomi_studio</div>
<button id="view" class="btn">VIEW</button>
<button id="btnRoll" class="btn">ROLL</button>
<button id="btnLoop" class="btn">LOOP</button>
<script>
(()=>{
'use strict';
// ---------- framebuffer ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,img,buf,ybuf,cmask;
function resize(){
  const ar=innerWidth/Math.max(1,innerHeight);
  H=ar<1?300:250;
  W=Math.round(Math.min(460,Math.max(140,H*ar)));
  cv.width=W;cv.height=H;
  img=ctx.createImageData(W,H);buf=new Uint32Array(img.data.buffer);
  ybuf=new Int32Array(W);cmask=new Uint8Array(W*H);
}
addEventListener('resize',resize);resize();

const RGB=(h)=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]};
const pack=(r,g,b)=>(0xFF000000|(b<<16)|(g<<8)|r)>>>0;
const packA=(a)=>pack(a[0]|0,a[1]|0,a[2]|0);
const scale=(c,f)=>[Math.min(255,c[0]*f),Math.min(255,c[1]*f),Math.min(255,c[2]*f)];
const mixA=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

// ---------- world: tileable value noise ----------
const N=512,M=511;
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noise(rand,periods){
  const out=new Float32Array(N*N);let amp=1,tot=0;
  for(const p of periods){
    const g=new Float32Array(p*p);for(let i=0;i<g.length;i++)g[i]=rand();
    const cell=N/p;
    for(let y=0;y<N;y++){
      const gy=y/cell,iy=gy|0,fy=gy-iy,sy=fy*fy*(3-2*fy),y0=iy%p*p,y1=(iy+1)%p*p;
      for(let x=0;x<N;x++){
        const gx=x/cell,ix=gx|0,fx=gx-ix,sx=fx*fx*(3-2*fx),x0=ix%p,x1=(ix+1)%p;
        const a=g[y0+x0]+(g[y0+x1]-g[y0+x0])*sx,b=g[y1+x0]+(g[y1+x1]-g[y1+x0])*sx;
        out[y*N+x]+=amp*(a+(b-a)*sy);
      }
    }
    tot+=amp;amp*=0.5;
  }
  for(let i=0;i<out.length;i++)out[i]/=tot;
  return out;
}
const rand=rng(20261201);
const base=noise(rand,[4,8,16,32,64]);
const cloudN=noise(rand,[8,16,32,64]);
// sea level at the 56th percentile so roughly 44% is land
const sorted=Float32Array.from(base).sort();
const SEA=sorted[(sorted.length*0.56)|0],TOP=sorted[sorted.length-1];
const CT=Float32Array.from(cloudN).sort()[(N*N*0.80)|0];
const HM=new Uint8Array(N*N),CM=new Uint32Array(N*N),WALL=new Uint32Array(N*N),SHADE=new Uint32Array(N*N),CL=new Uint8Array(N*N);
const MAXH=46,PEAK=31;
for(let i=0;i<N*N;i++){
  const n=base[i];
  if(n>SEA){const t=(n-SEA)/(TOP-SEA);HM[i]=Math.max(1,Math.floor(Math.pow(t,1.25)*MAXH));}
  const c=cloudN[i];CL[i]=c>CT?(c>CT+0.035?2:1):0;
}
const P={deep:RGB('#2468B2'),mid:RGB('#3489CF'),shal:RGB('#5CC0E2'),surf:RGB('#BDEBF0'),sand:RGB('#EBD49A'),
  g1:RGB('#9BD45A'),g2:RGB('#6DBB45'),g3:RGB('#4E9E3A'),tree:RGB('#2F7D3A'),tree2:RGB('#3F9A47'),
  rock:RGB('#9A928A'),rock2:RGB('#7A736E'),snow:RGB('#F6F5F1'),snow2:RGB('#DCE3EA')};
for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const i=y*N+x,h=HM[i];let c;
  const hash=((x*73856093)^(y*19349663))>>>0;
  if(h===0){
    const t=(SEA-base[i])/(SEA-sorted[0]);
    c=t<0.025?P.surf:t<0.12?P.shal:t<0.35?mixA(P.shal,P.mid,(t-0.12)/0.23):mixA(P.mid,P.deep,Math.min(1,(t-0.35)/0.4));
    if(t>=0.025&&(hash&511)===0)c=P.surf;
  }else{
    if(h<=2)c=P.sand;
    else if(h<=6)c=P.g1;
    else if(h<=11)c=P.g2;
    else if(h<=19)c=(hash%7<3)?P.tree:(hash%7<5?P.tree2:P.g3);
    else if(h<PEAK)c=(hash%5<2)?P.rock2:P.rock;
    else c=(hash%6<1)?P.snow2:P.snow;
    const hn=HM[((y+1)&M)*N+((x+1)&M)];
    const f=1+Math.max(-0.28,Math.min(0.28,(h-hn)*0.11));
    c=scale(c,f);
  }
  CM[i]=packA(c);WALL[i]=packA(scale(c,h===0?1:0.68));SHADE[i]=packA(scale(c,0.78));
}

// ---------- jet: 16 slices of 32x32 palette indices ----------
const PAL=[null,RGB('#F3EEE5'),RGB('#D8CDBE'),RGB('#5B3A86'),RGB('#7D59AE'),RGB('#FFC23D'),RGB('#7FD6A8'),RGB('#17131C'),RGB('#C9B3E6'),RGB('#FF8A3D')];
const SL=16,SS=32,jet=[];for(let i=0;i<SL;i++)jet.push(new Uint8Array(SS*SS));
const setP=(s,u,v,c)=>{const x=u+16,y=16-v;if(x>=0&&x<SS&&y>=0&&y<SS)jet[s][y*SS+x]=c;};
for(let v=-11;v<=12;v++){
  const w=v>8?(v>10?0:1):(v<-8?1:2);
  for(let u=-w;u<=w;u++){for(let s=2;s<=5;s++)setP(s,u,v,s===5?1:2);}
}
for(let v=2;v<=7;v++)for(let u=-1;u<=1;u++){setP(6,u,v,6);if(v>3&&v<7&&u===0)setP(7,u,v,6);}
for(let u=-13;u<=13;u++){const au=Math.abs(u);if(au<2)continue;
  const v0=Math.round(-3-au*0.42),v1=Math.round(2-au*0.42);
  for(let v=v0;v<=v1;v++){const c=au>=11?5:(v===v1?8:(au%4===0?4:3));setP(3,u,v,3);setP(4,u,v,c);}}
for(let u=-5;u<=5;u++)for(let v=-11;v<=-9;v++){if(Math.abs(u)<2)continue;setP(4,u,v,Math.abs(u)>=4?5:3);}
for(let s=5;s<=11;s++)for(let v=-11;v<=-11+Math.round((11-s)*0.5)+2;v++)setP(s,0,v,s>=10?5:3);
// ink outline slice at the bottom (silhouette of everything, grown by 1px)
(()=>{const sil=new Uint8Array(SS*SS);for(let s=2;s<SL;s++)for(let i=0;i<SS*SS;i++)if(jet[s][i])sil[i]=1;
  for(let y=0;y<SS;y++)for(let x=0;x<SS;x++){if(sil[y*SS+x])continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(X>=0&&X<SS&&Y>=0&&Y<SS&&sil[Y*SS+X]){jet[1][y*SS+x]=7;}}}
  // belly: the colour of the lowest slice at that pixel (darkened later), so an upside-down plane is not a black blob
  for(let i=0;i<SS*SS;i++)if(sil[i]){let c=7;for(let s=2;s<SL;s++)if(jet[s][i]){c=jet[s][i];break;}jet[1][i]=c===1?2:c;}})();
const jetPix=[];for(let s=0;s<SL;s++)for(let y=0;y<SS;y++)for(let x=0;x<SS;x++){const c=jet[s][y*SS+x];if(c)jetPix.push([x-16,16-y,s,c]);}
const PALI=PAL.map(c=>c?packA(c):0),PALD=PAL.map(c=>c?packA(scale(c,0.8)):0);

// ---------- camera ----------
const VIEWS=[{q:0,slope:1,S:1.7,cyF:0.5,back:0,lift:0.55},{q:0.013,slope:0.3,S:3.1,cyF:0.5,back:13,lift:1.0}];
let camLift=0;
const cam={x:0,y:0,z:0,ang:0,q:0,slope:1,S:1.7,cy:0,t:0,target:0,back:0};
let fx=1,fy=0,rx=0,ry=1;
function applyCam(){
  const e=cam.t*cam.t*(3-2*cam.t),A=VIEWS[0],B=VIEWS[1],L=(k)=>A[k]+(B[k]-A[k])*e;
  cam.q=L('q');cam.slope=L('slope');cam.S=L('S');cam.back=L('back');
  cam.cy=H*(portrait()?L('cyF')+0.04:L('cyF'));
  fx=Math.cos(cam.ang);fy=Math.sin(cam.ang);rx=-fy;ry=fx;
  cam.x=pl.x-fx*cam.back;cam.y=pl.y-fy*cam.back;
  cam.z=pl.z*L('lift')+e*10;
  // chase view: lift the camera over hills between it and the plane, so they don't cover the screen
  if(e>0){let g=0;for(let k=-0.5;k<=1;k+=0.25)g=Math.max(g,hMax(cam.x+fx*cam.back*k,cam.y+fy*cam.back*k,3));
    const need=Math.max(0,g+8-cam.z)*e;
    camLift+=(need-camLift)*(need>camLift?0.3:0.06);cam.z+=camLift;}
  cam.haze=e;
}
const portrait=()=>W<H;
function proj(wx,wy,z){
  const dx=wx-cam.x,dy=wy-cam.y,d=dx*fx+dy*fy,a=dx*rx+dy*ry,k=1+cam.q*d;
  if(k<=0.05)return null;const s=cam.S/k;
  return {x:W/2+s*a,y:cam.cy-s*(z-cam.z+cam.slope*d),s,d};
}

// ---------- sky / haze ----------
const SKYT=RGB('#5FA8E6'),SKYH=RGB('#DCEEF4'),HAZE=SKYH;
function drawSky(){
  const hz=cam.q>0?cam.cy-cam.S*cam.slope/cam.q+cam.S*cam.z*0:0;
  for(let y=0;y<H;y++){
    const t=cam.q>0?Math.max(0,Math.min(1,1-(hz-y)/(H*0.55))):0.6;
    const c=packA(mixA(SKYT,SKYH,t*t));
    buf.fill(c,y*W,(y+1)*W);
  }
}

// ---------- terrain renderer: near -> far columns, occupancy, no z-buffer ----------
let tick=0,cloudOff=0;
function drawWorld(){
  ybuf.fill(H);cmask.fill(0);
  const {q,slope,S}=cam,cy=cam.cy,cx=W/2;
  const CZ=24;
  let d=-(H-cy)/(S*slope)-4;
  if(q>0){
    // start the ground at the bottom edge of the screen (this can be a little behind the camera when it flies low),
    // so the nearest row never has to be stretched down into a tall wall
    d=1;const dMin=-0.55/q;
    while(d>dMin){const k=1+q*d,yy=cy-(S/k)*(slope*d-cam.z);if(yy>=H+2)break;d-=1.5;}
    d=Math.max(d,dMin);
  }
  const dFar=q>0?560:(cy+S*(MAXH+cam.z))/(S*slope)+4;
  const hr=HAZE[0],hg=HAZE[1],hb=HAZE[2];
  const co=cloudOff|0;
  while(d<dFar){
    const k=1+q*d;if(k<=0.05){d+=0.5;continue;}
    const s=S/k;
    const dd=Math.min(5,Math.max(0.4,k*k/(S*slope)*0.95));
    const baseY=cy-s*(slope*d-cam.z);
    if(baseY-s*MAXH>H){d+=dd;continue;}
    if(q===0&&baseY<0)break;
    const haze=q>0?Math.min(0.92,Math.max(0,(d-70)/440))*cam.haze:0;
    const thick=Math.max(1,s*slope*dd+1);
    let wx=cam.x+fx*d+rx*(-cx/s)+1e5,wy=cam.y+fy*d+ry*(-cx/s)+1e5;
    const sx=rx/s,sy=ry/s;
    const ctopBase=baseY-s*CZ;
    const s2=S/(1+q*(d+dd)),ctopNext=cy-s2*(slope*(d+dd)-cam.z)-s2*CZ;
    const cthick=Math.max(1,Math.abs(ctopBase-ctopNext)+1);
    for(let x=0;x<W;x++,wx+=sx,wy+=sy){
      const ix=(wx|0)&M,iy=(wy|0)&M,i=iy*N+ix;
      const yb=ybuf[x];
      // clouds (floating layer, writes the occupancy mask)
      const ci=iy*N+((ix+co)&M);
      const cl=CL[ci];
      if(cl&&ctopBase<yb&&(q===0||d>3)){
        const t0=Math.max(0,ctopBase|0),t1=Math.min(yb,(ctopBase+cthick+1)|0);
        let c=cl===2?0xFFFFFFFF:0xFFEFE6E0;
        if(haze>0){const r=c&255,g=c>>8&255,b=c>>16&255;c=pack(r+(hr-r)*haze|0,g+(hg-g)*haze|0,b+(hb-b)*haze|0);}
        for(let y=t0;y<t1;y++){const p=y*W+x;if(!cmask[p]){buf[p]=c;cmask[p]=1;}}
      }
      const h=HM[i];
      const top=(baseY-s*h)|0;
      if(top<yb){
        const shadow=CL[((iy+6)&M)*N+((ix+co+6)&M)];
        let c=shadow?SHADE[i]:CM[i],w=WALL[i];
        if(h===0&&((i*2654435761+(tick>>2))>>>0)%997===0)c=0xFFF5FBFF;
        if(haze>0){
          let r=c&255,g=c>>8&255,b=c>>16&255;c=pack(r+(hr-r)*haze|0,g+(hg-g)*haze|0,b+(hb-b)*haze|0);
          r=w&255;g=w>>8&255;b=w>>16&255;w=pack(r+(hr-r)*haze|0,g+(hg-g)*haze|0,b+(hb-b)*haze|0);
        }
        const y0=Math.max(0,top),yt=top+thick;
        for(let y=y0;y<yb;y++){const p=y*W+x;if(!cmask[p])buf[p]=y<yt?c:w;}
        ybuf[x]=top;
      }
    }
    d+=dd;
  }
}

// ---------- game state ----------
const pl={x:256,y:256,z:34,vz:0,ang:0,speed:24,bank:0,roll:0,rollT:0,rollDir:1,pitch:0,loopT:0,loopBase:0,fuel:100,score:0,suns:0,boost:false,dead:0,inv:0};
const ROLL_T=0.6,LOOP_T=1.35,ZMIN=7,ZMAX=64;
let state='title',orbs=[],mines=[],sparks=[],shake=0,best=0,flashT=0,chainLeft=0,chainAng=0,chainPos=null,chainZ=34,timeAlive=0;
let combo=0,comboT=0,level=1,mineT=3,skimT=0,trickHit=false,bestCombo=0,tricks=0;
try{best=+localStorage.getItem('pixelskies-best')||0}catch(e){}
function hAt(x,y){return HM[(((y+1e5)|0)&M)*N+(((x+1e5)|0)&M)];}
function hMax(x,y,r){let m=0;for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)m=Math.max(m,hAt(x+i*r,y+j*r));return m;}
function safeStart(){
  for(let tries=0;tries<400;tries++){
    const x=Math.random()*N,y=Math.random()*N;
    if(hAt(x,y)===0&&hAt(x+30,y)<12&&hAt(x-30,y)<12){pl.x=x;pl.y=y;return;}
  }
}
const mult=()=>1+Math.min(4,Math.floor(combo/3));
function spawnChain(){
  const side=(Math.random()<0.5?-1:1)*(0.45+Math.random()*0.5);
  chainAng=pl.ang-side*0.8;
  chainPos={x:pl.x+Math.cos(pl.ang+side)*85,y:pl.y+Math.sin(pl.ang+side)*85};
  chainZ=Math.max(14,Math.min(54,pl.z+(Math.random()-0.5)*16));
  chainLeft=5;
}
function burst(x,y,z,n,cols,spd){for(let k=0;k<n;k++){const a=Math.random()*6.28,v=spd*(0.5+Math.random());sparks.push({x,y,z,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vz:(Math.random()-0.3)*10,t:0.6+Math.random()*0.4,c:cols[k%cols.length]});}}
function updateOrbs(dt){
  if(orbs.length<6){
    if(chainLeft<=0)spawnChain();
    chainAng+=(Math.random()-0.5)*0.7;
    chainPos.x+=Math.cos(chainAng)*20;chainPos.y+=Math.sin(chainAng)*20;
    // from level 2 the chain climbs and dives, so you have to change altitude
    if(level>=2)chainZ=Math.max(12,Math.min(56,chainZ+(Math.random()-0.5)*(6+level*2)));
    const gz=hMax(chainPos.x,chainPos.y,4);
    const z=Math.max(chainZ,gz+7);
    if(z<ZMAX-2){
      orbs.push({x:chainPos.x,y:chainPos.y,z,ph:Math.random()*6});
      // level 3+: a storm guards some suns, so you roll through
      if(state==='play'&&level>=3&&Math.random()<0.18+level*0.04){
        const a=chainAng+Math.PI/2*(Math.random()<0.5?1:-1);
        mines.push({x:chainPos.x+Math.cos(a)*3.2,y:chainPos.y+Math.sin(a)*3.2,z,ph:Math.random()*6,near:false});
      }
    }
    chainLeft--;
  }
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i],dx=o.x-pl.x,dy=o.y-pl.y,dz=o.z-pl.z,dist=Math.hypot(dx,dy);
    const ahead=dx*Math.cos(pl.ang)+dy*Math.sin(pl.ang);
    if(dist<5.2&&Math.abs(dz)<5.5){
      orbs.splice(i,1);
      if(state==='play'){
        combo++;comboT=3.2;bestCombo=Math.max(bestCombo,combo);
        const m=mult(),pts=10*m;pl.fuel=Math.min(100,pl.fuel+12);pl.score+=pts;pl.suns++;sfx('chime');
        pop('+'+pts+(m>1?'  x'+m:''),'#FFC23D');
        if(pl.rollT>0||pl.loopT>0)trickHit=true;
      }
      burst(o.x,o.y,o.z,22,[0xFF3DC2FF,0xFFFFFFFF],12);
    }else if(ahead<-40||dist>260){
      orbs.splice(i,1);if(orbs.length===0)chainLeft=0;
      if(state==='play'&&ahead<-40&&dist<60&&combo>0){combo=0;pop('COMBO LOST','#C9B3E6');}
    }
  }
}
function spawnMine(){
  const dist=95+Math.random()*50,lat=(Math.random()-0.5)*46;
  const x=pl.x+Math.cos(pl.ang)*dist-Math.sin(pl.ang)*lat,y=pl.y+Math.sin(pl.ang)*dist+Math.cos(pl.ang)*lat;
  const z=Math.max(hMax(x,y,4)+6,Math.min(ZMAX-4,pl.z+(Math.random()-0.5)*10));
  mines.push({x,y,z,ph:Math.random()*6,near:false,vx:(Math.random()-0.5)*(level>=4?8:0),vy:(Math.random()-0.5)*(level>=4?8:0)});
}
function updateMines(dt){
  if(state==='play'){mineT-=dt;if(mineT<=0){spawnMine();if(level>=5&&Math.random()<0.5)spawnMine();mineT=Math.max(0.9,3.6-level*0.45)*(0.7+Math.random()*0.6);}}
  for(let i=mines.length-1;i>=0;i--){
    const m=mines[i];m.x+=(m.vx||0)*dt;m.y+=(m.vy||0)*dt;
    const dx=m.x-pl.x,dy=m.y-pl.y,dz=m.z-pl.z,dist=Math.hypot(dx,dy),d3=Math.hypot(dist,dz);
    const ahead=dx*Math.cos(pl.ang)+dy*Math.sin(pl.ang);
    if(state==='play'&&d3<4.4){
      mines.splice(i,1);
      if(pl.rollT>0||pl.loopT>0){pl.score+=15*mult();tricks++;pop('DODGE +'+15*mult(),'#7FD6A8');sfx('whoosh');burst(m.x,m.y,m.z,16,[0xFF863A5B,0xFFE6B3C9],10);}
      else{pl.fuel-=22;combo=0;shake=0.4;flashT=0.6;sfx('zap');pop('STORM -22 FUEL','#FF6B5B');burst(m.x,m.y,m.z,26,[0xFF863A5B,0xFF5B6BFF,0xFFFFFFFF],14);}
      continue;
    }
    if(state==='play'&&!m.near&&d3<9){m.near=true;}
    if(ahead<-30||dist>260){
      if(state==='play'&&m.near){pl.score+=5;pop('CLOSE CALL +5','#F3EEE5');}
      mines.splice(i,1);
    }
  }
}

const keys={};let pointer={active:false,x:0,y:0,down:false,t0:0,x0:0,y0:0,moved:false,mouse:false},steerX=0,climb=0,lastTap=0;
addEventListener('keydown',e=>{keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();if(state==='play')act('roll');}
  if(e.code==='KeyE'||e.code==='KeyQ')act('loop');

  if(state!=='play'&&state!=='falling'&&(e.code==='Enter'||e.code==='Space'))tap();});

cv.addEventListener('pointerdown',e=>{pointer.down=true;pointer.active=true;pointer.mouse=e.pointerType==='mouse';pointer.x=e.clientX;pointer.y=e.clientY;pointer.t0=performance.now();pointer.x0=e.clientX;pointer.y0=e.clientY;pointer.moved=false;});
addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;if(e.pointerType==='mouse'){pointer.active=true;pointer.mouse=true;}
  if(pointer.down&&Math.hypot(e.clientX-pointer.x0,e.clientY-pointer.y0)>12)pointer.moved=true;});

  if(!pointer.down)return;

  if(state!=='play'){if(state!=='falling')tap();return;}
  if(quick){if(now-lastTap<300){act('loop');lastTap=0;}else{lastTap=now;act('roll');}}

for(const [id,fn] of [['view',()=>toggleView()],['btnRoll',()=>act('roll')],['btnLoop',()=>act('loop')]]){

}

function act(a){
  if(state!=='play')return;
  if(a==='roll'&&pl.rollT<=0&&pl.loopT<=0){pl.rollT=ROLL_T;pl.rollDir=steerX>=0?1:-1;trickHit=false;sfx('whoosh');}

    if(pl.z-hMax(pl.x,pl.y,6)<9){pop('TOO LOW TO LOOP','#F3EEE5');return;}

// ---------- audio ----------
let AC=null,windG=null;
function audioInit(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){l=(l+0.02*(Math.random()*2-1))/1.02;d[i]=l*3.5;}
  const src=AC.createBufferSource();src.buffer=b;src.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=600;
  windG=AC.createGain();windG.gain.value=0;src.connect(f).connect(windG).connect(AC.destination);src.start();
}
function tone(freq,dur,type,vol,slide){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);
}
function sfx(n){
  if(n==='chime'){const m=mult();tone(880*(1+0.12*(m-1)),0.12,'square',0.06);setTimeout(()=>tone(1320*(1+0.12*(m-1)),0.18,'square',0.05),70);}
  if(n==='thud'){tone(140,0.35,'sawtooth',0.12,40);}
  if(n==='zap'){tone(220,0.3,'sawtooth',0.1,60);tone(90,0.4,'square',0.06,40);}
  if(n==='whoosh'){tone(300,0.4,'triangle',0.05,900);}
  if(n==='loop'){tone(200,0.9,'triangle',0.05,800);}
  if(n==='level'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'square',0.05),i*90));}
  if(n==='over'){tone(440,0.6,'square',0.06,110);}
}

// ---------- update ----------
function update(dt){
  tick++;cloudOff+=dt*3;
  let target=0,up=0;
  if(state==='play'){
    if(keys.ArrowLeft||keys.KeyA)target=-1;if(keys.ArrowRight||keys.KeyD)target=1;
    if(keys.ArrowUp||keys.KeyW)up=1;if(keys.ArrowDown||keys.KeyS)up=-1;
    if(pointer.active&&(pointer.down||pointer.mouse)){
      const v=(pointer.x-innerWidth/2)/(innerWidth*0.32);target=Math.max(-1,Math.min(1,v));if(Math.abs(target)<0.08)target=0;
      const w=-(pointer.y-innerHeight*0.55)/(innerHeight*0.28);up=Math.max(-1,Math.min(1,w));if(Math.abs(up)<0.12)up=0;
    }
    pl.boost=!!(keys.ShiftLeft||keys.ShiftRight||(pointer.mouse&&pointer.down&&performance.now()-pointer.t0>220&&!pointer.moved));
  }else{
    pl.boost=false;
    const o=orbs[0];
    if(o){let da=Math.atan2(o.y-pl.y,o.x-pl.x)-pl.ang;da=Math.atan2(Math.sin(da),Math.cos(da));target=Math.max(-1,Math.min(1,da*2));up=Math.max(-1,Math.min(1,(o.z-pl.z)*0.2));}
    const ax=pl.x+Math.cos(pl.ang)*25,ay=pl.y+Math.sin(pl.ang)*25;if(hAt(ax,ay)>=pl.z-6)target=1;
  }
  steerX+=(target-steerX)*Math.min(1,dt*6);
  climb+=(up-climb)*Math.min(1,dt*5);
  let hspeed=pl.speed;
  if(state==='falling'){
    pl.dead+=dt;pl.ang+=dt*2.4;pl.z-=dt*16;pl.bank+=dt*6;pl.pitch=-0.6;
    if(pl.z<hAt(pl.x,pl.y)+1||pl.dead>2.4){shake=0.5;sfx('thud');burst(pl.x,pl.y,Math.max(pl.z,1),30,[0xFFF6F5F1,0xFF3D8AFF,0xFF3DC2FF],12);gameOver();}
  }else{
    pl.ang+=steerX*1.75*dt;
    pl.bank+=((-steerX*0.8)-pl.bank)*Math.min(1,dt*5);
    if(pl.loopT>0){
      // vertical loop: pitch goes all the way round, the plane climbs then comes back down
      pl.loopT-=dt;const t=1-Math.max(0,pl.loopT)/LOOP_T,ph=t*Math.PI*2;
      pl.pitch=ph;pl.z=pl.loopBase+9*(1-Math.cos(ph))+4*Math.sin(ph)*0;hspeed=pl.speed*(0.35+0.65*Math.cos(ph));
      if(pl.loopT<=0){pl.pitch=0;pl.z=pl.loopBase;if(state==='play'){const pts=(trickHit?50:25)*mult();pl.score+=pts;tricks++;pop((trickHit?'SUN LOOP +':'LOOP +')+pts,'#7FD6A8');}}
    }else{
      pl.vz+=((climb*20)-pl.vz)*Math.min(1,dt*4);
      pl.z=Math.max(ZMIN,Math.min(ZMAX,pl.z+pl.vz*dt));
      pl.pitch+=((pl.vz*0.022)-pl.pitch)*Math.min(1,dt*6);
    }
  }
  if(pl.rollT>0){
    pl.rollT-=dt;const t=1-Math.max(0,pl.rollT)/ROLL_T;pl.roll=t*Math.PI*2*pl.rollDir;
    // the roll also sidesteps
    const side=Math.sin(t*Math.PI)*16*dt*pl.rollDir;pl.x+=-Math.sin(pl.ang)*side;pl.y+=Math.cos(pl.ang)*side;
    if(pl.rollT<=0&&state==='play'&&trickHit){const pts=20*mult();pl.score+=pts;tricks++;pop('ROLL GRAB +'+pts,'#7FD6A8');}
  }else pl.roll=0;
  if(state==='play'){
    timeAlive+=dt;
    const nl=1+Math.floor(timeAlive/25);
    if(nl>level){level=nl;sfx('level');pop('LEVEL '+level,'#F3EEE5');pl.fuel=Math.min(100,pl.fuel+15);}
    const base=Math.min(46,22+level*2.6+(timeAlive%25)*0.05);
    pl.speed+=((pl.boost?base*1.6:base)-pl.speed)*Math.min(1,dt*2);
    pl.fuel-=dt*(4.6+level*0.35+(pl.boost?5:0));
    if(comboT>0){comboT-=dt;if(comboT<=0&&combo>0){combo=0;}}
    // skimming low over water scores points
    const gh0=hAt(pl.x,pl.y);
    if(gh0===0&&pl.z<12&&pl.loopT<=0){skimT+=dt;if(skimT>=0.5){skimT=0;pl.score+=2*mult();pop('SKIM +'+2*mult(),'#BDEBF0');}}else skimT=0;
    // terrain
    const gh=hAt(pl.x+Math.cos(pl.ang)*3,pl.y+Math.sin(pl.ang)*3);
    if(gh>=pl.z-2.5&&flashT<=0){
      pl.fuel-=28;shake=0.45;flashT=0.6;sfx('thud');combo=0;pop('CRASH -28 FUEL','#FF6B5B');
      pl.loopT=0;pl.pitch=0;pl.z=Math.min(ZMAX,gh+8);pl.vz=10;pl.ang+=Math.PI*0.6;
      burst(pl.x,pl.y,gh,26,[0xFFF6F5F1,0xFF8A8A9A],10);
    }
    if(pl.fuel<=0){pl.fuel=0;state='falling';pl.dead=0;pl.loopT=0;pl.rollT=0;}
  }else if(state!=='falling'){pl.speed=24;}
  if(flashT>0)flashT-=dt;
  pl.x+=Math.cos(pl.ang)*hspeed*dt;pl.y+=Math.sin(pl.ang)*hspeed*dt;
  updateOrbs(dt);updateMines(dt);
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=12*dt;if(p.t<=0)sparks.splice(i,1);}
  // camera
  let da=pl.ang-cam.ang;da=Math.atan2(Math.sin(da),Math.cos(da));
  cam.ang+=da*Math.min(1,dt*(2.2+cam.t*1.2));
  cam.t+=(cam.target-cam.t)*Math.min(1,dt*1.6);if(Math.abs(cam.target-cam.t)<0.002)cam.t=cam.target;
  if(shake>0)shake-=dt;
  if(windG)windG.gain.value=state==='play'?0.04+pl.speed/46*0.08:0.02;
  if(state==='play'){
    $('score').textContent=pl.score;$('orbs').textContent=pl.suns+' SUNS · LV '+level;
    const m=mult();$('combo').textContent=m>1?'COMBO x'+m:(combo>0?'COMBO '+combo:'');
    const f=$('fuel');f.style.width=pl.fuel+'%';f.style.background=pl.fuel<25?'#FF6B5B':'#7FD6A8';
    $('alt').style.height=((pl.z-ZMIN)/(ZMAX-ZMIN)*100)+'%';
    $('btnRoll').style.opacity=pl.rollT>0||pl.loopT>0?0.5:1;$('btnLoop').style.opacity=pl.rollT>0||pl.loopT>0?0.5:1;
  }
}

// ---------- sprites ----------
function rect(x,y,w,h,c){
  const x0=Math.max(0,x|0),y0=Math.max(0,y|0),x1=Math.min(W,(x+w)|0),y1=Math.min(H,(y+h)|0);
  for(let yy=y0;yy<y1;yy++){const r=yy*W;for(let xx=x0;xx<x1;xx++)buf[r+xx]=c;}
}
function darken(cx,cy,rx,ry,f){
  f=f||0.7;
  for(let y=Math.max(0,cy-ry|0);y<Math.min(H,cy+ry+1);y++)for(let x=Math.max(0,cx-rx|0);x<Math.min(W,cx+rx+1);x++){
    const u=(x-cx)/rx,v=(y-cy)/ry;if(u*u+v*v<=1){const p=y*W+x,c=buf[p];buf[p]=pack((c&255)*f|0,(c>>8&255)*f|0,(c>>16&255)*(f+0.02)|0);}
  }
}
const PS=0.42,ZS=0.34;
function drawJet(){
  const rel=Math.atan2(Math.sin(pl.ang-cam.ang),Math.cos(pl.ang-cam.ang));
  const cr=Math.cos(rel),sr=Math.sin(rel),roll=pl.bank+pl.roll,cl=Math.cos(roll),sl=Math.sin(roll);
  const cp=Math.cos(pl.pitch),sp=Math.sin(pl.pitch);
  const dx=pl.x-cam.x,dy=pl.y-cam.y,pd=dx*fx+dy*fy,pa=dx*rx+dy*ry;
  const list=[];
  const flame=pl.boost||pl.loopT>0||state==='title'?((tick>>1)&1?5:9):0;
  const extra=flame?[[0,-12,3,flame],[0,-12,4,flame],[0,-13,3,9],[1,-12,3,flame],[-1,-12,3,flame]]:[];
  for(const src of [jetPix,extra])for(const p of src){
    const a0=p[0]*PS,f0=p[1]*PS,z0=(p[2]-4)*ZS;
    const a1=a0*cl-z0*sl,z1=a0*sl+z0*cl;
    const f1=f0*cp-z1*sp,z2=f0*sp+z1*cp;
    const f2=f1*cr-a1*sr,a2=f1*sr+a1*cr;
    const d=pd+f2,k=1+cam.q*d;if(k<=0.05)continue;const s=cam.S/k;
    list.push([cam.slope*z2-d,W/2+s*(pa+a2),cam.cy-s*(pl.z+z2-cam.z+cam.slope*d),s,p[3],p[2]]);
  }
  list.sort((A,B)=>A[0]-B[0]);
  const flash=flashT>0&&((tick>>2)&1);
  for(const p of list){const sz=Math.max(1,Math.ceil(p[3]*PS*1.15));const c=flash?0xFFFFFFFF:(p[5]<=3&&p[4]!==7?PALD[p[4]]:PALI[p[4]]);rect(p[1]-sz/2,p[2]-sz/2,sz,sz,c);}
}
function disc(cx,cy,r,fn){
  for(let y=Math.floor(cy-r-1);y<=cy+r+1;y++)for(let x=Math.floor(cx-r-1);x<=cx+r+1;x++){
    if(x<0||y<0||x>=W||y>=H)continue;const u=x+0.5-cx,v=y+0.5-cy,c=fn(u,v,Math.sqrt(u*u+v*v));if(c)buf[y*W+x]=c;
  }
}
function drawOrb(o,pr){
  const r=Math.max(1.5,pr.s*1.7),bob=Math.sin(performance.now()/300+o.ph)*pr.s*0.5;
  disc(pr.x,pr.y+bob,r,(u,v,q)=>q<=r*0.45?0xFFE6FBFF:q<=r?(u+v<0?0xFF6BDDFF:0xFF3DC2FF):q<=r+1?0xFF1C1317:0);
}
function drawMine(m,pr){
  const r=Math.max(1.5,pr.s*1.9),bob=Math.sin(performance.now()/240+m.ph)*pr.s*0.6,blink=((tick>>3)+(m.ph*3|0))&1;
  const cx=pr.x,cy=pr.y+bob,sp=r*1.55,t=performance.now()/400+m.ph;
  disc(cx,cy,r,(u,v,q)=>{
    if(q<=r*0.38)return blink?0xFF6B6BFF:0xFF3A3AD0;
    if(q<=r)return (u+v<0?0xFF9A5C7A:0xFF6B3A55);
    if(q<=r+1)return 0xFF1C1317;
    // spikes
    const a=Math.atan2(v,u)-t,k=Math.abs(Math.sin(a*3));if(q<=sp&&k>0.93)return 0xFF1C1317;
    return 0;});
  if(pr.d<120)rect(cx-0.5,cy-r-2.5,1,1,blink?0xFFFFFFFF:0xFF6B6BFF);
}
function shadowAt(x,y,size){
  const p=proj(x,y,hAt(x,y));if(!p)return;
  darken(p.x,p.y,Math.max(1,p.s*size),Math.max(1,p.s*size*Math.max(0.35,cam.slope)),0.8);
}
function render(){
  applyCam();
  drawSky();drawWorld();
  if(state!=='over')shadowAt(pl.x,pl.y,2.6);
  for(const o of orbs)shadowAt(o.x,o.y,1.1);
  for(const m of mines)shadowAt(m.x,m.y,1.2);
  const items=[];
  for(const o of orbs){const p=proj(o.x,o.y,o.z);if(p&&p.d>0.5)items.push([p.d,'o',o,p]);}
  for(const m of mines){const p=proj(m.x,m.y,m.z);if(p&&p.d>0.5)items.push([p.d,'m',m,p]);}
  const jp=proj(pl.x,pl.y,pl.z);items.push([jp?jp.d:0,'j']);
  for(const s of sparks){const p=proj(s.x,s.y,s.z);if(p)items.push([p.d,'s',s,p]);}
  items.sort((a,b)=>b[0]-a[0]);
  for(const it of items){
    if(it[1]==='j'){if(state!=='over'||cam.t>0.05)drawJet();}
    else if(it[1]==='o')drawOrb(it[2],it[3]);
    else if(it[1]==='m')drawMine(it[2],it[3]);
    else{const p=it[3],sz=Math.max(1,Math.round(p.s*0.6));rect(p.x,p.y,sz,sz,it[2].c);}
  }
  ctx.putImageData(img,0,0);
  if(shake>0){const m=Math.ceil(shake*10);cv.style.transform=`translate(${(Math.random()-0.5)*m}px,${(Math.random()-0.5)*m}px)`;}else cv.style.transform='';
  $('flash').style.opacity=flashT>0.45?0.35:0;
}

// ---------- loop ----------
safeStart();
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);render();
  requestAnimationFrame(frame);
